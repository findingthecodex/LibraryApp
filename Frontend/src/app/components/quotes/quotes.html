<div class="container mt-5">
  <h2 class="mb-4">
    <i class="fas fa-quote-left"></i> My Quotes
  </h2>

  <button class="btn btn-primary mb-4" (click)="toggleForm()">
    <i class="fas fa-plus"></i> Add New Quote
  </button>

  <!-- Form -->
  <div *ngIf="showForm" class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">{{ editingId ? 'Edit' : 'Add New' }} Quote</h5>
      <form (ngSubmit)="saveQuote()">
        <div class="mb-3">
          <label class="form-label">Quote</label>
          <textarea class="form-control" [(ngModel)]="newQuote.text" name="text" rows="3" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Author</label>
          <input type="text" class="form-control" [(ngModel)]="newQuote.author" name="author" required />
        </div>
        <button type="submit" class="btn btn-success" [disabled]="loading">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="toggleForm()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Lista -->
  <div class="row">
    <div *ngFor="let quote of quotes | slice:0:5" class="col-md-6 mb-4">
      <div class="card h-100">
        <div class="card-body">
          <blockquote class="blockquote">
            <p class="mb-0">"{{ quote.text }}"</p>
            <footer class="blockquote-footer">{{ quote.author }}</footer>
          </blockquote>
        </div>

        <div class="card-footer">
          <button class="btn-action btn-edit" (click)="editQuote(quote)">
            <i class="fas fa-edit"></i> Edit
          </button>
          <button class="btn-action btn-delete" (click)="deleteQuote(quote.id)">
            <i class="fas fa-trash"></i> Delete
          </button>
        </div>

      </div>
    </div>
  </div>

  <div *ngIf="quotes.length === 0 && !showForm" class="alert alert-info">
    No quotes yet. Add your first!
  </div>
</div>
